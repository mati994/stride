width:390px;color:#a4b9ad;line-height:1.55}.pill{display:inline-block;border-radius:50px;background:#294337;color:#b4e0bd;font-size:11px;padding:5px 10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#16241feF;backdrop-filter:blur(20px);border-top:1px solid #30473e;padding:11px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:9}.nav button{flex:1;max-width:190px;border:0;border-radius:11px;background:transparent;color:#8fa79a;padding:10px 8px;font-size:12px}.nav button.selected{background:#2b4739;color:#c3e9c8}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.exercisehead{display:flex;justify-content:space-between;align-items:start;gap:8px}.metric{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.metric label{display:grid;gap:6px;font-size:10px;color:#a9bdb1;text-transform:uppercase;letter-spacing:.1em}.metric input{width:100%;min-width:0;border:1px solid #3e5b4a;border-radius:10px;background:#101d18;color:#f0f6ef;padding:12px 6px;text-align:center;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}.metric input:focus{border-color:#badfbf}.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 38px;gap:7px;align-items:center;margin-top:9px}.setrow label{font-size:10px;color:#a9bdb1;display:grid;gap:4px;text-align:center}.setrow input{min-width:0;width:100%;border:1px solid #3d554a;background:#101d18;color:#fff;border-radius:9px;padding:11px 2px;text-align:center;font-size:16px}.setrow .index{font-size:12px;color:#b9d2c3}.xbtn{width:36px;height:42px;background:transparent;border:1px solid #4c6259;color:#f0b5ad;border-radius:9px}.hint{font-size:12px;line-height:1.55;color:#9aafa3;margin-top:10px}.divider{border:0;border-top:1px solid #33483d;margin:16px 0}.listline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #30473e}.listline:last-child{border:0}.empty{padding:40px 24px;text-align:center;color:#a3b6aa;border:1px dashed #476054;border-radius:14px;margin-top:18px}.input,.textarea{width:100%;background:#111f19;border:1px solid #476054;color:white;border-radius:10px;padding:12px}.textarea{min-height:72px;resize:vertical}.field{display:grid;gap:7px;font-size:13px;color:#acbfb1;margin-top:12px}.notice{background:#223c31;border:1px solid #517a5d;color:#d1f1d3;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}.warning{background:#382e29;border-color:#805b4e;color:#ffddc8}.dots{font-size:19px;letter-spacing:2px}a{color:#b8e5bd}.stat{flex:1;padding:12px;background:#21382d;border-radius:12px}.stat b{display:block;font-size:22px;margin-bottom:3px}.squeeze{line-height:1.55}.hidden{display:none!important}.footer{margin-top:36px;text-align:center;font-size:11px;color:#718d7d}#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:25;background:#c5edce;color:#173225;padding:12px 18px;border-radius:12px;box-shadow:0 10px 40px #0007;font-weight:600;max-width:90vw}.kbd{font-variant-numeric:tabular-nums}

<body><div class="app"><header class="top"><div class="brand">str<i>i</i>de<span style="font-size:9px;color:#a3c7af;margin-left:8px;letter-spacing:2px;font-family:Inter,sans-serif">LOG</span></div><div class="small" id="today"></div></header><main id="main"></main><footer class="footer">Dein Training. Deine Daten. · Offline-fähig</footer></div><nav class="nav" id="nav"></nav><div id="toast" hidden></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='stride-log-v1';
const DEFAULT=[
{id:'leg',name:'Beinpresse',sets:3,min:6,max:8,rest:'120 Sek.',note:'Kontrollierte Tiefe; schmerzfreie Bewegungsamplitude.'},
{id:'rdl',name:'Romanian Deadlift',sets:3,min:6,max:8,rest:'120 Sek.',note:'Hüfte nach hinten; Hantel nah am Körper; Rücken neutral.'},
{id:'row',name:'Rudermaschine',sets:2,min:8,max:12,rest:'75–90 Sek.',note:'Nach Möglichkeit brustgestützt; ohne Schwung ziehen.'},
{id:'press',name:'Kurzhantel-Bankdrücken',sets:2,min:8,max:12,rest:'75 Sek.',note:'Kontrolliert absenken; stabile Schulterblätter.'},
{id:'calf',name:'Wadenheben stehend',sets:3,min:8,max:12,rest:'60 Sek.',note:'Volle schmerzfreie Bewegung; kein Federn.'},
{id:'pallof',name:'Pallof Press',sets:2,min:10,max:10,rest:'30 Sek.',note:'10 Wiederholungen je Seite. Gewicht: kg am Kabelzug.'},
{id:'add',name:'Adduktor-Squeeze',sets:3,min:20,max:30,rest:'30–45 Sek.',unit:'Sek.',note:'20–30 Sekunden je Satz. Gewicht optional leer lassen. Leicht bis moderat drücken.'}];
let db=null, state={page:'home',sessionId:null,notice:'',editPlan:false}, store={version:1,plan:DEFAULT,sessions:[]};
const $=q=>document.querySelector(q), escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const stamp=()=>new Date().toISOString();const fmt=d=>new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB nicht verfügbar'));let r=indexedDB.open('stride-workout-db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function readDB(){return new Promise((res,rej)=>{let r=db.transaction('data','readonly').objectStore('data').get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function writeDB(data){return new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(data,KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
let writing=Promise.resolve();function persist(){let snapshot=structuredClone(store);writing=writing.catch(()=>{}).then(()=>writeDB(snapshot)).catch(e=>{console.error(e);state.notice='Speichern fehlgeschlagen! Bitte exportiere deine Daten und überprüfe den verfügbaren Speicher.';render()});return writing}
function toast(msg){let t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>t.hidden=true,2400)}
function session(){return store.sessions.find(s=>s.id===state.sessionId)}
function newSession(){const active=store.sessions.find(s=>!s.done);if(active){state.sessionId=active.id;state.page='workout';return render()}let s={id:uid(),started:stamp(),done:null,note:'',exercises:store.plan.map(x=>({id:uid(),planId:x.id,name:x.name,min:x.min,max:x.max,unit:x.unit||'Wdh.',note:x.note,rest:x.rest,sets:Array.from({length:x.sets},()=>({id:uid(),kg:'',reps:'',rir:'',checked:false}))}))};store.sessions.unshift(s);state.sessionId=s.id;state.page='workout';persist();render()}
function lastSets(planId,exclude){return store.sessions.filter(s=>s.id!==exclude&&s.done).flatMap(s=>s.exercises.filter(e=>e.planId===planId).map(e=>({date:s.started,sets:e.sets}))).at(0)}
function nav(){let items=[['home','⌂','Start'],['history','▤','Historie'],['plan','▦','Plan'],['settings','⚙','Daten']];$('#nav').innerHTML=items.map(([p,i,t])=>`<button data-page="${p}" class="${state.page===p||(p==='home'&&state.page==='workout')?'selected':''}"><span style="font-size:20px;display:block;margin-bottom:3px">${i}</span>${t}</button>`).join('')}
function render(){nav();$('#today').textContent=new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});let html='';if(state.notice)html+=`<div class="notice warning">${escapeHtml(state.notice)} <button class="btn sm" data-action="dismiss">OK</button></div>`;if(state.page==='home')html+=home();if(state.page==='workout')html+=workout();if(state.page==='history')html+=history();if(state.page==='plan')html+=plan();if(state.page==='settings')html+=settings();$('#main').innerHTML=html}
function home(){let count=store.sessions.filter(s=>s.done).length, active=store.sessions.find(s=>!s.done), latest=store.sessions.find(s=>s.done);return `<section class="hero"><div class="eyebrow">Dein Raum für Fortschritt</div><h1>Stärker laufen.<br>Bewusster trainieren.</h1><p>Kein Schnickschnack. Dokumentiere jeden Satz, behalte deine Entwicklung im Blick und ändere Einträge jederzeit.</p><button class="btn primary" data-action="${active?'resume':'start'}">${active?'Training fortsetzen →':'Runner Strength starten →'}</button></section><div class="row"><div class="stat"><b>${count}</b><span class="small">abgeschlossene Einheiten</span></div><div class="stat"><b>${store.plan.length}</b><span class="small">Übungen im Plan</span></div></div><div class="sectionhead"><h2>Zuletzt trainiert</h2><button class="btn sm ghost" data-page="history">Alle ansehen</button></div>${latest?`<div class="card"><div class="eyebrow">${fmt(latest.started)}</div><h2>Runner Strength</h2><p class="muted small">${latest.exercises.length} Übungen · ${latest.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.checked).length,0)} protokollierte Sätze</p><button class="btn sm" data-open="${latest.id}">Ansehen & bearbeiten →</button></div>`:`<div class="empty">Noch keine abgeschlossene Einheit. Deine Historie beginnt mit deinem ersten Training. 🌱</div>`}<div class="card"><div class="eyebrow">Hinweis zur Datensicherheit</div><p class="small squeeze">Deine Daten werden auf diesem Gerät im Browser gespeichert. Exportiere regelmäßig ein Backup unter <b>Daten</b> – bei gelöschten Website-Daten oder Geräteverlust kann die lokale Historie verloren gehen.</p></div>`}
function workout(){let s=session();if(!s){state.page='home';return home()}let done=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.checked).length,0),total=s.exercises.reduce((n,e)=>n+e.sets.length,0);return `<div class="sectionhead"><div><div class="eyebrow">${s.done?'Abgeschlossen · bearbeitbar':'Training läuft'}</div><h1 class="heading" style="margin-top:8px">Runner Strength</h1><p class="muted small">${fmt(s.started)} · ${done}/${total} Sätze markiert</p></div><button class="btn sm ghost" data-page="history">← Historie</button></div>${s.done?`<div class="notice">Diese Einheit ist abgeschlossen. Du kannst trotzdem jederzeit alle Werte, Übungen und Sätze ändern.</div>`:''}${s.exercises.map((e,i)=>exercise(e,i,s.id)).join('')}<div class="card"><label class="field">Notiz zu diesem Training<textarea class="textarea" data-session-note="${s.id}" placeholder="Wie fühlte sich das Training an?">${escapeHtml(s.note)}</textarea></label><div class="row between" style="margin-top:16px;flex-wrap:wrap"><button class="btn ${s.done?'ghost':'primary'}" data-action="${s.done?'reopen':'finish'}">${s.done?'Wieder als aktiv markieren':'Training abschließen ✓'}</button><button class="btn danger sm" data-action="delete-session">Einheit löschen</button></div></div>`}
function exercise(e,index,sid){let last=lastSets(e.planId,sid),preview=last?last.sets.filter(s=>s.checked).map(s=>(s.kg!==''?`${s.kg} kg · `:'')+`${s.reps} ${e.unit}`).join(' / '):'';return `<div class="card" id="ex-${e.id}"><div class="exercisehead"><div><div class="eyebrow">Übung ${String(index+1).padStart(2,'0')}</div><h2>${escapeHtml(e.name)}</h2><div class="small">${e.min}–${e.max} ${escapeHtml(e.unit)} · RIR ≈2–3 ${e.rest?'· Pause '+escapeHtml(e.rest):''}</div></div><button class="btn sm ghost" data-action="rename-exercise" data-ex="${e.id}" aria-label="Übung bearbeiten">✎</button></div>${last?`<div class="soft small" style="margin-top:12px"><span class="eyebrow">Letztes Mal · ${fmt(last.date)}</span><div style="margin-top:5px">${escapeHtml(preview||'Keine markierten Sätze')}</div></div>`:''}<div class="hint">${escapeHtml(e.note)}</div><div class="row" style="margin:15px 0 7px"><div class="small grow">SATZ</div><span class="small" style="width:21%;text-align:center">KG</span><span class="small" style="width:21%;text-align:center">${e.unit==='Sek.'?'SEK.':'WDH.'}</span><span class="small" style="width:21%;text-align:center">RIR</span><span class="small" style="width:36px;text-align:center">✓</span></div>${e.sets.map((s,j)=>`<div class="setrow"><span class="index">${j+1}</span><input type="number" min="0" step="0.5" inputmode="decimal" aria-label="Gewicht Satz ${j+1} ${escapeHtml(e.name)}" data-field="kg" data-ex="${e.id}" data-set="${s.id}" value="${escapeHtml(s.kg)}" placeholder="–"><input type="number" min="0" step="1" inputmode="numeric" aria-label="${e.unit} Satz ${j+1} ${escapeHtml(e.name)}" data-field="reps" data-ex="${e.id}" data-set="${s.id}" value="${escapeHtml(s.reps)}" placeholder="–"><input type="number" min="0" max="10" step="0.5" inputmode="decimal" aria-label="RIR Satz ${j+1}" data-field="rir" data-ex="${e.id}" data-set="${s.id}" value="${escapeHtml(s.rir)}" placeholder="–"><button class="xbtn" data-action="toggle-set" data-ex="${e.id}" data-set="${s.id}" style="${s.checked?'background:#b4e0bd;color:#1a3425;border-color:#b4e0bd':''}" title="Satz ${s.checked?'als offen':'als erledigt'} markieren">${s.checked?'✓':'○'}</button></div>`).join('')}<div class="row between" style="margin-top:14px"><button class="btn sm ghost" data-action="add-set" data-ex="${e.id}">+ Satz hinzufügen</button><button class="btn sm danger" data-action="remove-set" data-ex="${e.id}" ${!e.sets.length?'disabled':''}>Letzten Satz löschen</button></div></div>`}
function history(){let list=store.sessions;return `<div class="eyebrow" style="margin-top:25px">Dein Archiv</div><h1 class="heading">Trainingshistorie</h1><p class="muted">Jede Einheit und jeder Satz bleibt editierbar.</p>${list.length?list.map(s=>`<div class="card"><div class="row between"><div><div class="eyebrow">${fmt(s.started)} · ${s.done?'Abgeschlossen':'Noch aktiv'}</div><h2>Runner Strength</h2><div class="small">${s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.checked).length,0)} Sätze protokolliert</div></div><button class="btn sm" data-open="${s.id}">${s.done?'Öffnen':'Fortsetzen'} →</button></div></div>`).join(''):`<div class="empty">Deine Trainingshistorie ist noch leer.</div>`}`}
function plan(){return `<div class="eyebrow" style="margin-top:25px">Deine Vorlage</div><h1 class="heading">Runner Strength</h1><p class="muted">Änderungen an der Vorlage gelten für neue Workouts. Bereits protokollierte Einheiten bleiben unverändert.</p>${store.plan.map((e,i)=>`<div class="card"><div class="row between"><div><span class="eyebrow">${String(i+1).padStart(2,'0')}</span><h2>${escapeHtml(e.name)}</h2><div class="small">${e.sets} × ${e.min}–${e.max} ${escapeHtml(e.unit||'Wdh.')}</div></div><button class="btn sm ghost" data-action="edit-plan-ex" data-plan="${e.id}">Bearbeiten</button></div></div>`).join('')}<button class="btn ghost full" style="margin-top:17px" data-action="add-plan-ex">+ Übung hinzufügen</button>`}
function settings(){return `<div class="eyebrow" style="margin-top:25px">Deine Daten</div><h1 class="heading">Sichern & verwalten</h1><div class="card"><h2>Backup erstellen</h2><p class="muted squeeze">Exportiere alle Trainings, Sätze, Notizen und deinen Plan als JSON-Datei. Speichere sie zum Beispiel in iCloud Drive.</p><button class="btn primary full" data-action="export">↓ Daten exportieren</button></div><div class="card"><h2>Backup wiederherstellen</h2><p class="muted squeeze">Importiert ein früheres Backup. <strong>Achtung:</strong> Der Import ersetzt alle aktuell in dieser App gespeicherten Daten.</p><button class="btn full ghost" data-action="import">↑ JSON-Datei importieren</button></div><div class="card"><h2>Speicherung</h2><p class="muted squeeze">Diese Version speichert lokal mit IndexedDB. Ohne Konto gibt es keine Synchronisierung auf andere Geräte. Bei einem Wechsel kannst du ein Backup exportieren und importieren.</p><p class="small">${store.sessions.length} gespeicherte Einheiten</p></div><div class="card"><h2>Alle Daten löschen</h2><p class="muted squeeze">Unwiderruflich ohne Backup.</p><button class="btn danger" data-action="reset">Daten zurücksetzen</button></div>`}
function currentExercise(id){return session()?.exercises.find(e=>e.id===id)}
function updateField(el){let e=currentExercise(el.dataset.ex),s=e?.sets.find(x=>x.id===el.dataset.set);if(!s)return;let value=el.value;if(value!==''&&(!Number.isFinite(Number(value))||Number(value)<0||(el.dataset.field==='rir'&&Number(value)>10))) {toast('Bitte einen gültigen Wert eingeben');el.value=s[el.dataset.field];return} s[el.dataset.field]=value;persist()}
function editPlanExercise(id){let e=store.plan.find(x=>x.id===id);if(!e)return;let name=prompt('Name der Übung',e.name);if(name===null)return;name=name.trim();if(!name)return toast('Name darf nicht leer sein');let sets=prompt('Anzahl Sätze (1–20)',e.sets);if(sets===null)return;let min=prompt('Wiederholungen / Sekunden MIN',e.min);if(min===null)return;let max=prompt('Wiederholungen / Sekunden MAX',e.max);if(max===null)return;let a=Number(sets),b=Number(min),c=Number(max);if(!Number.isInteger(a)||a<1||a>20||!Number.isInteger(b)||b<1||!Number.isInteger(c)||c<b||c>1000)return toast('Ungültige Werte');Object.assign(e,{name,sets:a,min:b,max:c});persist();render();toast('Vorlage aktualisiert')}
function downloadBackup(){const backup={type:'stride-workout-backup',exportedAt:stamp(),version:1,store};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stride-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Backup erstellt')}
function validData(x){return x&&x.version===1&&Array.isArray(x.plan)&&Array.isArray(x.sessions)&&x.plan.length<1000&&x.sessions.length<100000&&x.sessions.every(s=>typeof s.id==='string'&&Array.isArray(s.exercises)&&s.exercises.every(e=>typeof e.name==='string'&&Array.isArray(e.sets)&&e.sets.every(a=>typeof a.id==='string')))}
async function importFile(f){if(!f)return;if(f.size>25*1024*1024)return toast('Datei zu groß (max. 25 MB)');let parsed;try{parsed=JSON.parse(await f.text())}catch{return toast('Ungültige JSON-Datei')}if(parsed?.type!=='stride-workout-backup'||!validData(parsed.store))return toast('Kein gültiges Stride-Backup');if(!confirm('Alle aktuell gespeicherten Trainings durch dieses Backup ersetzen?'))return;let old=store;store=parsed.store;try{await persist();state.page='home';state.sessionId=null;render();toast('Backup importiert')}catch{store=old;toast('Import fehlgeschlagen')}}
$('#importFile').addEventListener('change',async e=>{await importFile(e.target.files[0]);e.target.value='' });
document.addEventListener('input',e=>{if(e.target.dataset.field)updateField(e.target);if(e.target.dataset.sessionNote){let s=session();if(s){s.note=e.target.value;persist()}}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.dataset.open){state.sessionId=b.dataset.open;state.page='workout';render();window.scrollTo(0,0);return}let a=b.dataset.action;if(!a)return;let s=session(),ex=currentExercise(b.dataset.ex);if(a==='dismiss'){state.notice='';render()}if(a==='start'||a==='resume')newSession();if(a==='add-set'&&ex){ex.sets.push({id:uid(),kg:'',reps:'',rir:'',checked:false});persist();render()}if(a==='remove-set'&&ex?.sets.length){if(!confirm('Letzten Satz dieser Übung löschen?'))return;ex.sets.pop();persist();render()}if(a==='toggle-set'&&ex){let row=ex.sets.find(x=>x.id===b.dataset.set);if(row){row.checked=!row.checked;persist();render()}}if(a==='finish'&&s){s.done=stamp();persist();state.page='history';render();toast('Training abgeschlossen – jederzeit bearbeitbar')}if(a==='reopen'&&s){if(store.sessions.some(x=>x.id!==s.id&&!x.done))return toast('Bitte zuerst die andere aktive Einheit abschließen');s.done=null;persist();render();toast('Training wieder aktiv')}if(a==='delete-session'&&s){if(confirm('Diese Trainingseinheit samt aller Sätze endgültig löschen?')){store.sessions=store.sessions.filter(x=>x.id!==s.id);state.sessionId=null;state.page='history';persist();render()}}if(a==='rename-exercise'&&ex){let n=prompt('Name dieser Übung in dieser Einheit',ex.name);if(n!==null&&n.trim()){ex.name=n.trim();persist();render()}}if(a==='edit-plan-ex')editPlanExercise(b.dataset.plan);if(a==='add-plan-ex'){let n=prompt('Name der neuen Übung');if(n?.trim()){store.plan.push({id:uid(),name:n.trim(),sets:2,min:8,max:12,rest:'',note:'',unit:'Wdh.'});persist();render()}}if(a==='export')downloadBackup();if(a==='import')$('#importFile').click();if(a==='reset'&&confirm('Wirklich ALLE Daten löschen? Ohne Backup können sie nicht wiederhergestellt werden.')&&confirm('Letzte Bestätigung: Alles unwiderruflich löschen?')){store={version:1,plan:structuredClone(DEFAULT),sessions:[]};state={page:'home',sessionId:null,notice:''};persist();render()}});
(async()=>{try{db=await openDB();let saved=await readDB();if(validData(saved))store=saved;else if(saved)state.notice='Gespeicherte Daten konnten nicht gelesen werden. Keine Änderungen vornehmen, bevor ein Backup geprüft ist.';render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){console.error(e);state.notice='Dein Browser erlaubt hier keine dauerhafte Speicherung. Bitte die App über HTTPS öffnen. Trainingseinträge werden derzeit NICHT zuverlässig gespeichert.';render()}})();
</script></body></html>
